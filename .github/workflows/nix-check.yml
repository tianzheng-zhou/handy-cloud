name: Nix package check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nix-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: cachix/install-nix-action@v31
      - run: bunx bun2nix@2.0.8 -o .nix/bun.nix
      - run: git diff --exit-code .nix/bun.nix
      - run: nix flake check --no-build
      - run: nix build .#handy -L --show-trace
