name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check:nix-deps
      - run: bunx prettier --check .
      - run: bun run lint
      - run: bun run check:translations
      - run: bun test tests/unit
      - run: bun run build
      - run: bun run check:bundle
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:playwright
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  rust-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev libxdo-dev libxtst-dev libxrandr-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: ONNX Runtime for VAD
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/ort.tgz" https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          echo "ORT_LIB_LOCATION=$RUNNER_TEMP/onnxruntime-linux-x64-1.24.2/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime-linux-x64-1.24.2/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Regenerate and verify bindings
        run: |
          bun run bindings
          git diff --exit-code -- src/bindings.ts
