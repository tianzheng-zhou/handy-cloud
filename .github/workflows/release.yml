name: Release

# Pushing a v* tag tests on every shipped OS, builds unsigned packages and
# opens a draft GitHub Release for review. Bump with `bun run version:bump`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches declared versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
          conf=$(grep -m1 -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if [[ "$tag" != "$pkg" || "$tag" != "$conf" || "$tag" != "$cargo" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version; run bun run version:bump $tag"
            exit 1
          fi

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  # Windows and macOS are not verified on hardware, so at least run the Rust
  # tests and lints natively before packaging them.
  rust-native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  build:
    needs: [checks, rust-native]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      no-cache: true

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun scripts/release-notes.ts "$GITHUB_REF_NAME" > notes.md
          mapfile -d '' files < <(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -print0)
          printf 'Attaching %s\n' "${files[@]}"
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --draft "${prerelease[@]}" \
            --title "Handy Cloud $GITHUB_REF_NAME" --notes-file notes.md "${files[@]}"
